# Раздача релизов keel. TLS и домен — на Traefik из Dokploy, здесь только
# отдача файлов.

server {
    listen 80;
    server_name _;

    root /srv/keel;

    # Показывать содержимое каталога незачем: все имена известны заранее.
    autoindex off;

    # Контрольные суммы и метка версии не кешируются никогда. Иначе после
    # релиза install.sh скачает свежий бинарник, сверит его со старой суммой
    # из кеша и откажется ставить — с виду как подмена файла.
    location ~ ^/(checksums\.txt|VERSION)$ {
        add_header Cache-Control "no-store" always;
        default_type text/plain;
    }

    # install.sh правится чаще бинарника и должен доезжать свежим.
    location = /install.sh {
        add_header Cache-Control "no-store" always;
        default_type text/plain;
    }

    location / {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Ответ для проверки живости контейнера.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }
}
